[workspace]
members = [
    "crates/rivet-core",
    "crates/rivet-scheduler",
    "crates/rivet-worker",
    "crates/rivet-client",
]
resolver = "2"

# Versions live here so the four crates cannot drift apart. Each crate opts in
# with `serde = { workspace = true }`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unused_imports = "warn"
dead_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
